[project]
name = "nexora-ai-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "pandas>=2.2,<3.0",
    "scikit-learn>=1.6,<2.0",
    "pydantic-settings>=2.8,<3.0",
    "SQLAlchemy>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "boto3>=1.35,<2.0",
    "python-multipart>=0.0.20,<1.0",
    "pytest>=8.3,<9.0",
    "httpx>=0.28,<1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
